<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFMC PowerPack</title>
    <link rel="stylesheet" href="/styles/popup.css">
</head>
<body>
    <div class="container">
        <div class="category">
            <a target="_blank" href="https://chromewebstore.google.com/detail/sfmc-powerpack/jhimopfgakbjgabjecbhpeakehinmopk">
                <img src="/sfmc-powerpack-logo.png" class="logo" alt="">
            </a>
            <div class="inline">
                <span>Extension</span>
                <input class="toggle" id="global" type="checkbox">
            </div>
        </div>
        <div class="category border">
            <span>Test recipient manager</span>
            <input class="toggle" id="test-recipients" type="checkbox">
        </div>
        <div class="category border">
            <span>Folder structure expansion</span>
            <input class="toggle" id="folder-expand" type="checkbox">
        </div>
        <div class="category">
            <span>Show Audience folder ID</span>
            <input class="toggle" id="folder-id" type="checkbox">
        </div>
        <div class="category">
            <span>Show "Total excluded" send count</span>
            <input class="toggle" id="total-exclusion" type="checkbox">
        </div>
        <div class="category border">
            <span>Query Studio tabs</span>
            <input class="toggle" id="query-studio" type="checkbox">
        </div>
        <div>
            <img class="cloud-bottom" src="/static/images/cloud-bottom.png" alt="">
            <div class="cloud-block">
                <span class="small">Version 0.5.0</span>
                <div>
                    <a target="_blank" href="https://chromewebstore.google.com/detail/jhimopfgakbjgabjecbhpeakehinmopk/support">
                        <span class="small">
                            Report issue
                        </span>
                    </a>
                    <a target="_blank" href="https://chromewebstore.google.com/detail/jhimopfgakbjgabjecbhpeakehinmopk/support">
                        <span class="small">
                            Suggest a feature
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="/pages/localStorage.js"></script>
    <script src="/pages/popup.js"></script>
</body>
</html>
